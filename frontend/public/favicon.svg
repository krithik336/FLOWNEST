<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded background square/circle for best contrast on light/dark mode browser tabs -->
  <rect width="32" height="32" rx="8" fill="#0a1a0f" />
  <g transform="translate(4, 4) scale(1)" stroke-linecap="round">
    <!-- Outer Nest Ring -->
    <path d="M12 3a9 9 0 0 1 9 9c0 4.97-4.03 9-9 9S3 16.97 3 12a9 9 0 0 1 6.36-8.58" 
          stroke="#4ade80" 
          stroke-width="2" 
          stroke-opacity="0.35" />
    <!-- Middle Nest Ring -->
    <path d="M12 6a6 6 0 0 1 6 6c0 3.31-2.69 6-6 6s-6-2.69-6-6a6 6 0 0 1 4.24-5.72" 
          stroke="#4ade80" 
          stroke-width="2" 
          stroke-opacity="0.7" />
    <!-- Inner Nest Ring -->
    <path d="M12 9a3 3 0 0 1 3 3c0 1.66-1.34 3-3 3s-3-1.34-3-3a3 3 0 0 1 2.12-2.86" 
          stroke="#4ade80" 
          stroke-width="2" />
    <!-- Center Dot -->
    <circle cx="12" cy="12" r="1.5" fill="#4ade80" />
  </g>
</svg>